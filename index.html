<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00007f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calibración IPFNA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: tablero de instrumento — barra de servicio fija arriba, pasos como pestañas, una tarjeta de trabajo por paso, barra de navegación abajo */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#14232e; --muted:#5b6b77; --line:#d3dbe1;
  --accent:#0f5e78; --accent-ink:#ffffff; --signal:#c77b06; --ok:#1d7a46; --bad:#b4322b;
  --field:#f7f9fa; --chip:#e2e9ee;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:860px;margin:0 auto}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:grid;gap:8px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.01em}
.svc{font-family:var(--f-mono);font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.status{font-size:13px;color:var(--muted)}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.steps button{flex:0 0 auto;font:600 14px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;display:flex;gap:6px;align-items:center;cursor:pointer;min-height:36px}
.steps button .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.steps button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button.on .n{color:var(--accent-ink)}
.steps button .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.steps button .dot.done{background:var(--ok)} .steps button .dot.warn{background:var(--signal)}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:18px}
h2{font-family:var(--f-display);font-weight:600;font-size:28px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;letter-spacing:.01em}
.lead{color:var(--muted);margin:0;max-width:65ch}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid > *{min-width:0}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em}
input,select,textarea{font:500 17px var(--f-body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px;width:100%}
input.num{font-family:var(--f-mono);font-size:18px;text-align:right}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
input.err{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--field))}
.hint{font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.hint.bad{color:var(--bad)} .hint.warn{color:var(--signal)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.calc div{background:var(--field);padding:10px 12px;display:grid;gap:2px}
.calc span{font-size:12px;color:var(--muted);letter-spacing:.01em}
.calc b{font-family:var(--f-mono);font-weight:500;font-size:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:nowrap}
.seg button{font:600 15px var(--f-body);background:var(--field);color:var(--ink);border:0;border-left:1px solid var(--line);padding:8px 14px;min-height:44px;min-width:56px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.q{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.q:last-child{border-bottom:0}
.q p{margin:0;flex:1 1 280px;min-width:0}
.btn{font:600 16px var(--f-body);border-radius:8px;padding:10px 16px;min-height:46px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sig{background:var(--signal);border-color:var(--signal);color:#1b1205}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:520px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{font-size:12px;letter-spacing:.01em;color:var(--muted);font-weight:600;background:var(--field)}
td.l,th.l{text-align:left}
td input.num{min-height:42px;padding:6px 8px;font-size:17px;min-width:120px}
.mono{font-family:var(--f-mono)}
.pill{display:inline-block;font:600 12px var(--f-body);letter-spacing:.01em;border-radius:999px;padding:3px 9px;background:var(--chip);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--signal) 20%,transparent);color:var(--signal)}
.note{border-left:4px solid var(--signal);background:color-mix(in srgb,var(--signal) 10%,var(--panel));padding:10px 12px;border-radius:0 8px 8px 0;font-size:15px}
.note.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.note.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--panel))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:500 14px var(--f-mono);border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:6px;padding:6px 9px;min-height:38px;cursor:pointer}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
details.grp{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
details.grp summary{cursor:pointer;font-weight:600;padding-block:4px}
.comp{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ecc{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:620px){.ecc{grid-template-columns:1fr}}
@media (max-width:560px){table{min-width:0}th,td{padding:6px 5px}td input.num{min-width:92px;font-size:16px;padding:6px}.hide-sm{display:none}.top .status{width:100%}}
.plate{max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:8px}
.plate svg,.forma svg{display:block;width:100%;height:auto}
svg .body{fill:color-mix(in srgb,var(--accent) 22%,var(--panel));stroke:var(--accent);stroke-width:2}
svg .ln{stroke:var(--accent);stroke-width:1.2}
svg .bar{fill:color-mix(in srgb,var(--accent) 38%,var(--panel));stroke:var(--accent);stroke-width:1.5}
svg .hook{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
svg .pt circle{fill:var(--panel);stroke:var(--accent);stroke-width:1.5}
svg .pt text{font:600 14px var(--f-mono);fill:var(--ink)}
svg .pt.filled circle{fill:var(--accent)} svg .pt.filled text{fill:var(--accent-ink)}
.formas{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding-top:8px}
.forma{display:grid;gap:4px;justify-items:center;text-align:center;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:8px;cursor:pointer;font:600 14px var(--f-body)}
.forma small{font:500 12px var(--f-body);color:var(--muted)}
.forma.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
nav.foot{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
nav.foot .wrap{display:flex;gap:10px;justify-content:space-between;align-items:center}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;flex-wrap:wrap;background:var(--field)}
.item > div{min-width:0}
pre.json{font:12px/1.4 var(--f-mono);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all}
@media (prefers-reduced-motion:no-preference){.steps button,.btn,.seg button{transition:background .15s,color .15s}}

.brand small{flex-basis:100%;color:var(--muted)}
#vistaSw{border-color:var(--navy)}
#vistaSw button.on{background:var(--navy);color:#fff}
.steps button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.steps button .dot.warn{background:var(--signal)}
section.card{border-top:4px solid var(--signal);box-shadow:0 2px 10px rgba(0,0,127,.07)}
h2{color:var(--navy);font-weight:700}
h3{color:var(--royal)}
.btn.pri{background:var(--accent);border-color:var(--accent)}
#btnEnviar{background:var(--signal);border-color:var(--signal);color:#fff}
.seg button.on{background:var(--royal);color:#fff}
.chips button.on{background:var(--royal);border-color:var(--royal);color:#fff}
.calc b{color:var(--navy)}
th{background:#eef0fa;color:var(--navy)}
.note{border-left-color:var(--signal)}
.note.ok{border-left-color:var(--ok)}
nav.foot{border-top:3px solid var(--navy)}
nav.foot .btn.pri{background:var(--navy);border-color:var(--navy)}
input.num{font-size:18px}
:root{color-scheme:light}

function parseNum(s){ if(s===null||s===undefined) return null; s=String(s).replace(/[\s  ]/g,"").replace(",","."); if(s===""||s==="-") return null; const n=Number(s); return isFinite(n)?n:NaN; }

const r6 = x => Math.round(x*1e6)/1e6;

/* ---------- réplica de BD (cálculos de la plantilla) ---------- */
function calcBase(s){

  const out={e:null,clase:null,n:null,min:null,cargas:[],rep:null,exc:null,iniciales:[],avisos:[]};
  if(!(N>0)||!(O>0)) return out;

  else { if(eq(.0001))e=10*O; else if(eq(.0002))e=5*O; else if(eq(.0005))e=2*O; else if(eq(.1)) e = N>=10000?10*O:O; }

  else if((AM>=.001&&AM<=.05&&T>=100&&T<=100000)||(AM>=.1&&T>=10000&&T<=100000)) c="II";
  else if((AM>=.1&&AM<=2&&T>=100&&T<=10000)||(AM>=5&&T>=500&&T<=10000)) c="III";
  else if(AM>=5&&T>=100&&T<=1000) c="IIII";
  if(c==="Revisar"){ out.avisos.push("La combinación Max / e no encaja en una clase OIML; la plantilla la trata como Clase I. Revisar con el RT."); c="I"; }
  out.clase=c; const n=N/e; let min=null;

  else if(c==="II"&&n>=100&&n<=100000&&AM>=.001&&AM<=.05) min=20*e;
  else if(c==="II"&&n>=5000&&n<=100000&&AM>=.1) min=50*e;
  else if(c==="III"&&n>=100&&n<=10000&&AM>=.1&&AM<=2) min=20*e;
  else if(c==="III"&&n>=500&&n<=10000&&AM>=5) min=20*e;
  else if(c==="IIII") min=10*e;
  else out.avisos.push("Capacidad mínima: la plantilla marca «Revisar».");
  out.min=min===null?null:r6(min);
  if(R>0 && [5,6,7,8].includes(U)){

function repMin3(eq){ const c=eq&&eq.rep; if(typeof c!=="number") return false; const kg=(S.unidad==="kg")?c:c/1000; return kg>=100-1e-9; }

function calcEquipo(s){

  return r6(m<=k[0]*e?e:m<=k[1]*e?2*e:3*e); }

/* ---------- composición de cargas con las pesas ---------- */
function componer(objetivo_g, sets){
  const meta=Math.round(objetivo_g*1000); const grupos=new Map();
  sets.forEach(sc=>(INV[sc]||[]).forEach(v=>{const k=Math.round(v*1000); if(!grupos.has(k))grupos.set(k,[]); grupos.get(k).push({set:sc,v});}));
  const den=[...grupos.keys()].filter(v=>v<=meta).sort((a,b)=>b-a);
  const resto=den.map((_,i)=>den.slice(i).reduce((s,v)=>s+v*grupos.get(v).length,0)); resto.push(0);
  let pasos=0;
  function dfs(i,falta){ if(falta===0) return []; if(i>=den.length||resto[i]<falta||++pasos>200000) return null; const v=den[i];
    for(let n=Math.min(grupos.get(v).length,Math.floor(falta/v));n>=0;n--){ const s=dfs(i+1,falta-n*v); if(s) return grupos.get(v).slice(0,n).concat(s);} return null; }
  return dfs(0,meta);
}

  set("J81",S.t1); set("X81",S.h1); set("B93",S.obs);
  const bd={A:idHC(),B:normCodigo(S.bd.codigo),C:S.proc1||PROC1[0],D:S.bd.direccion,E:S.bd.equipo,F:S.bd.cliente,G:S.bd.marca,H:S.bd.modelo,I:S.bd.serie,J:S.bd.periodo,K:S.bd.ubicacion,L:S.bd.lugar,
    M:S.max?`0 ${S.unidad} a ${fmt(S.max)} ${S.unidad}`.replace(/ /g," "):"",N:S.max,O:S.d,P:S.unidad,R:S.alcance,U:Number(S.ncargas),AJ:S.bd.correo,AK:S.bd.telefono,AL:S.bd.encargado};
  const sinExc = !!FORMAS[S.forma]?.sinExc; const nv=v=>typeof v==="number"?v:"N/A";
  const reemplazo = eq.cargas.length ? { V:nv(eq.iniciales[0]), W:nv(eq.iniciales[1]), X:nv(eq.iniciales[2]), Y: sinExc?"N/A":nv(eq.excIni),
    Z:nv(eq.cargas[0]), AA:nv(eq.cargas[1]), AB:nv(eq.cargas[2]), AC:nv(eq.cargas[3]), AD:nv(eq.cargas[4]), AE:nv(eq.cargas[5]), AF:nv(eq.cargas[6]), AG:nv(eq.cargas[7]),
    AH:nv(eq.rep), AI: sinExc?"N/A":nv(eq.exc) } : (sinExc?{Y:"N/A",AI:"N/A"}:undefined);
  const refsLect=Object.keys(b).filter(k=>typeof b[k]==="number"&&/^(N|R|V|Z|AC|AG|AK)35$|^(N|X|AG)3[78]$|^L(5[5-9]|6[0-2])$|^AW(5[5-9]|6[0-9])$|^C(69|7[0-5])$/.test(k));
  const formato_lecturas = S.d ? {decimales:dec(+S.d.toFixed(6)),celdas:{balanzas:refsLect}} : undefined;
  return {servicio:S.id, uid:S.uid, BD:bd, BD_reemplazar_formula:reemplazo, celdas:{balanzas:b}, formato_lecturas, patrones:{seleccion:S.sets,unidad:S.unidad,cargas:eq.cargas.map(c=>c===null?"N/A":c)},
    meta:{equipo_id:S.equipoId||"",contacto_id:S.contactoId||"",certificado:numCertificado(),pgvi:S.pgvi,forma:S.forma,app:"HC-01 Campo",version:"0.1-prototipo",plantilla:"HC-01 balanzas Ver. 13",tecnico:S.tecnico,ajuste:S.ajuste,capturado:new Date().toISOString()}};
}

/* ---------- envío ---------- */
let dbRef=null, userRef=null;
(async()=>{ try{ dbRef=await window.claude?.use?.("db"); userRef=await window.claude?.use?.("user"); }catch(e){} if(dbRef){ escucharEnviadas(); cargarBase(true); } })();
function escucharEnviadas(){ try{ dbRef.collection("capturas").orderBy("enviado","desc").limit(20).onSnapshot(q=>{ window._env=q.docs.map(d=>d.data()); pintarEnviadas(); },()=>{}); }catch(e){} }
function pintarEnviadas(){ const el=document.getElementById("enviadas"); if(!el||!window._env) return; const L=window._env;
  el.replaceChildren(h("h3",{},"Enviadas al laboratorio"), L.length?h("div",{cls:"list"},...L.map(c=>h("div",{cls:"item"},h("div",{},h("b",{cls:"mono"},c.servicio)," · ",c.BD?.F||"",h("div",{cls:"hint"},(c.meta?.tecnico||"")+" · "+new Date(c.enviado).toLocaleString("es-NI"))),h("span",{cls:"pill "+(c.estado==="HC generada"?"ok":"warn")},c.estado||"Recibida")))):h("p",{cls:"hint"},"Aún no hay capturas enviadas.")); }
const GRUN = !!(window.google && google.script && google.script.run);   // abierta desde Google Apps Script
const API_URL = "https://script.google.com/macros/s/AKfycbw-Esb5K23xBnm6ZJXTZ4sg4vPwLGFoPJlk1lwfz__DmKXoFRZhu4okpleVKDrKZRaW/exec";                                                  // abierta como app instalada (GitHub Pages)
const MODO_WEB = !GRUN && /^https:\/\/script\.google\.com\//.test(API_URL);
const MODO_GOOGLE = GRUN || MODO_WEB;                                       // hay servidor del laboratorio
function leerClave(){ try{ return localStorage.getItem("hc01-clave")||""; }catch(e){ return ""; } }
/* ---------- cola de envío sin señal ---------- */
const LSQ="hc01-cola";
function leerCola(){ try{ return JSON.parse(localStorage.getItem(LSQ))||[]; }catch(e){ return []; } }
function guardarCola(q){ try{ localStorage.setItem(LSQ,JSON.stringify(q)); }catch(e){} }
const esFallaRed = e => !navigator.onLine || /network|red|conex|failed to fetch|load failed|timeout|NetworkError/i.test(String(e&&e.message||e));
function marcarEnviado(id,r){ const t=new Date().toISOString(); if(S.uid===id||(!S.uid&&S.id===id)){ S.enviado=t; S.enCola=false; S.hc=r; } if(B[id]){ B[id].enviado=t; B[id].enCola=false; } guardarLocal(); }
function encolar(cap,clave){ const q=leerCola().filter(x=>(x.cap.uid||x.cap.servicio)!==(cap.uid||cap.servicio)); q.push({cap,clave,t:new Date().toISOString()}); guardarCola(q);
  if(S.uid===cap.uid){ S.enCola=true; } if(B[cap.uid]) B[cap.uid].enCola=true; guardarLocal(); }
let procesando=false;
async function procesarCola(){
  if(procesando||!MODO_GOOGLE||!navigator.onLine||!leerCola().length) return; procesando=true;
  try{ await subirPendientes(); }catch(e){} // primero los clientes/equipos nuevos: así la captura ya lleva el código definitivo
  const q=leerCola();
  const quedan=[];
  for(const it of q){ try{ const r=await gas("recibirCaptura",JSON.stringify(it.cap),it.clave); marcarEnviado(it.cap.uid||it.cap.servicio,r); }
    catch(e){ if(esFallaRed(e)) quedan.push(it); else { it.error=String(e&&e.message||e); quedan.push(it); } } }
  guardarCola(quedan); procesando=false; if(vista==="toma") render();
}
window.addEventListener("online",()=>{ procesarCola(); cargarBase(true); });
setInterval(procesarCola,60000);
function enviarGoogle(cap){
  const msg=$("#envioMsg"); const clave=($("#f-clave")?.value||leerClave()).trim();
  try{ localStorage.setItem("hc01-clave",clave); }catch(e){}
  if(!navigator.onLine){ encolar(cap,clave); render(); $("#envioMsg").replaceChildren(h("div",{cls:"note"},"Sin señal: la captura quedó en cola y se enviará sola al recuperar la conexión.")); return; }
  $("#btnEnviar").disabled=true; msg.replaceChildren(h("div",{cls:"note"},"Enviando y generando la "+hcNombre()+"…"));
  gas("recibirCaptura",JSON.stringify(cap),clave)
    .then(r=>{ marcarEnviado(cap.uid,r); render();
      $("#envioMsg").replaceChildren(h("div",{cls:r.aviso?"note":"note ok"},r.aviso?("Captura recibida. "+r.aviso):("Enviado. "+hcNombre()+" generada: "+r.nombre+". El laboratorio la recibió por correo y en Drive."))); })
    .catch(e=>{ $("#btnEnviar").disabled=false;
      if(esFallaRed(e)){ encolar(cap,clave); render(); $("#envioMsg").replaceChildren(h("div",{cls:"note"},"Sin conexión: la captura quedó en cola y se enviará sola al recuperar la señal.")); return; }
      $("#envioMsg").replaceChildren(h("div",{cls:"note bad"},"No se pudo enviar: "+(e&&e.message||e)+". Los datos siguen guardados en este equipo; corrija e intente de nuevo.")); });
}
async function enviar(){
  const msg=$("#envioMsg");
  if(MODO_GOOGLE&&PEND.length&&navigator.onLine){ try{ await subirPendientes(); }catch(e){} }
  const cap=construirCaptura();
  if(MODO_GOOGLE) return enviarGoogle(cap);
  if(!dbRef){ msg.replaceChildren(h("div",{cls:"note bad"},"No hay conexión con el laboratorio desde esta vista. Use «Descargar respaldo» y vuelva a intentar con conexión.")); return; }
  $("#btnEnviar").disabled=true; msg.replaceChildren(h("div",{cls:"note"},"Enviando…"));
  try{ const uid=userRef?await userRef.id?.():null; const now=new Date().toISOString();
    await dbRef.collection("capturas").doc(S.id.replace(/[\/\s]/g,"_")).set({...cap,estado:"Recibida",enviado:now,enviado_por:uid||null});
    S.enviado=now; cambio(); msg.replaceChildren(h("div",{cls:"note ok"},"Enviado. El laboratorio lo verá en la lista de capturas recibidas.")); render();
  }catch(e){ $("#btnEnviar").disabled=false; const c=e?.code||""; msg.replaceChildren(h("div",{cls:"note bad"}, c==="not_granted"||c==="permission_denied"?"Su usuario no tiene permiso para enviar. Pida al laboratorio que lo agregue como colaborador.":"No se pudo enviar ("+(c||"error")+"). Los datos siguen guardados en este equipo; intente de nuevo.")); }
}
async function descargar(){ const msg=$("#envioMsg"); try{ const dl=await window.claude?.use?.("downloads"); if(!dl){ msg.replaceChildren(h("div",{cls:"note"},"La descarga no está disponible en esta vista. Abra «Ver datos que recibe la plantilla» y copie el contenido.")); return; }
  await dl.save({filename:(S.id||"captura")+"_"+hcNombre()+".json",data:JSON.stringify(construirCaptura(),null,1)}); }catch(e){ msg.replaceChildren(h("div",{cls:"note"},"Descarga cancelada.")); } }

/* ---------- render ---------- */
function pintarPasos(){ $("#steps").replaceChildren(...PASOS.map(([k,t],i)=>h("button",{type:"button",role:"tab","aria-selected":i===paso,cls:i===paso?"on":"",on:{click:()=>{paso=i;render();}}},h("span",{cls:"n"},String(i+1)),t,h("span",{cls:"dot "+(i<9?estadoPaso(i):"")})))); }
function render(){
  $("#svcTag").textContent=S.id||"Sin servicio";
  { const t=document.getElementById("subHC"); if(t) t.textContent=esH2()?"HC-02 · PC-II-F1 básculas camioneras":"HC-01 · PC-I-F1 balanzas"; }
  $("#sw-toma").classList.toggle("on",vista==="toma"); $("#sw-base").classList.toggle("on",vista==="base");
  $("#steps").hidden=vista!=="toma"; document.querySelector("nav.foot").hidden=vista!=="toma";
  if(vista==="base"){ $("#main").replaceChildren(h("section",{cls:"card"},...vistaBase())); return; }
  $("#main").replaceChildren(h("section",{cls:"card"},...V[PASOS[paso][0]]()));
  pintarPasos(); pintarEnviadas();
  $("#prevBtn").disabled=paso===0; $("#nextBtn").textContent=paso===PASOS.length-1?"Inicio":"Siguiente";
  $("#stepLabel").textContent=`Paso ${paso+1} de ${PASOS.length}`;
  $("#steps").children[paso]?.scrollIntoView({block:"nearest",inline:"center"});
}

/* ---------- tema claro / oscuro ---------- */
function temaEfectivo(){ const t=document.documentElement.dataset.theme; if(t) return t; return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"; }
function pintarBotonTema(){ const b=document.getElementById("btnTema"); if(b) b.textContent=temaEfectivo()==="dark"?"Modo claro":"Modo oscuro"; }
(function(){ let t=null; try{ t=localStorage.getItem("hc01-tema"); }catch(e){} if(t==="dark"||t==="light") document.documentElement.dataset.theme=t;
  const b=document.getElementById("btnTema"); if(b) b.onclick=()=>{ const n=temaEfectivo()==="dark"?"light":"dark"; document.documentElement.dataset.theme=n; try{ localStorage.setItem("hc01-tema",n); }catch(e){} pintarBotonTema(); };
  try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",pintarBotonTema); }catch(e){} pintarBotonTema(); })();
$("#sw-toma").onclick=()=>{vista="toma";render();window.scrollTo(0,0);};
$("#sw-base").onclick=()=>{vista="base";render();window.scrollTo(0,0);};
$("#prevBtn").onclick=()=>{ if(paso>0){paso--;render();window.scrollTo(0,0);} };
$("#nextBtn").onclick=()=>{ paso=paso<PASOS.length-1?paso+1:0; render(); window.scrollTo(0,0); };
render(); guardarLocal();
if(MODO_GOOGLE) setTimeout(()=>{ cargarBase(true); procesarCola(); },300);
</script>

<script>
/* App instalable: guarda la app en el teléfono para que abra sin internet */
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
